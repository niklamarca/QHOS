name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  v1:
    name: v1 (research platform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: v1/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest --cov --cov-report=term

  v2:
    name: v2 (qhos2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/qhos2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: v2/qhos2/requirements-linux.lock
      - run: pip install -r requirements-linux.lock pytest-cov
      - run: pip install --no-deps -e .
      - run: python -m pytest -ra --cov=src --cov-report=term
